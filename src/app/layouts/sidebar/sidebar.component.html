<div class="sidebar">
  <div class="sidebar-header">
    <button class="btn btn-sm btn-light" (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
  </div>
  <div class="sidebar-menu">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <i class="bi bi-house"></i> <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/guest/view-products" routerLinkActive="active">
          <i class="bi bi-cart"></i> <span>Browse Products</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="isLoggedIn">
        <a class="nav-link" routerLink="/users/add-products" routerLinkActive="active">
          <i class="bi bi-plus-circle"></i> <span>Add Products</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="!isLoggedIn">
        <a class="nav-link" routerLink="/auth/login" routerLinkActive="active">
          <i class="bi bi-box-arrow-in-right"></i> <span>Login</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="!isLoggedIn">
        <a class="nav-link" routerLink="/auth/register" routerLinkActive="active">
          <i class="bi bi-person-plus"></i> <span>Register</span>
        </a>
      </li>
    </ul>
  </div>
</div>
