<header class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">My Angular App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/guest/view-products" routerLinkActive="active">Products</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" routerLink="/users/add-products" routerLinkActive="active">Add Products</a>
        </li>
      </ul>
      <div class="d-flex align-items-center">
        <div *ngIf="!isLoggedIn">
          <a routerLink="/auth/login" class="btn btn-outline-light me-2">Login</a>
          <a routerLink="/auth/register" class="btn btn-light">Register</a>
        </div>
        <div ngbDropdown *ngIf="isLoggedIn" class="user-dropdown">
          <button class="btn btn-outline-light" id="userDropdown" ngbDropdownToggle>
            <i class="bi bi-person-circle"></i> My Account
          </button>
          <div ngbDropdownMenu aria-labelledby="userDropdown">
            <button ngbDropdownItem routerLink="/users">Profile</button>
            <button ngbDropdownItem (click)="logout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
