<h6>ACTIVITY 03/18/25</h6>
<input [(ngModel)] ="name" placeholder="Enter Name:"><br><br>
<input [(ngModel)] ="email" placeholder="Enter Email:"><br><br>
<input [(ngModel)] ="phone_no" placeholder="Enter Phone Number:"><br><br>
<input [(ngModel)] ="address" placeholder="Enter Address:"><br><br>
<input [(ngModel)] ="ssn" placeholder="Enter Social Security Number:"><br><br>

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Open Input Modal
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Your Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="name" name="name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email">
          </div>
          <div class="form-group">
            <label for="phone_no">Phone Number</label>
            <input type="text" class="form-control" id="phone_no" [(ngModel)]="phone_no" name="phone_no">
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" class="form-control" id="address" [(ngModel)]="address" name="address">
          </div>
          <div class="form-group">
            <label for="ssn">Social Security Number</label>
            <input type="text" class="form-control" id="ssn" [(ngModel)]="ssn" name="ssn">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="saveData()">Save changes</button>
      </div>
    </div>
  </div>
</div>
