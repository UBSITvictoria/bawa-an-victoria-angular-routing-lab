<div class="row">
  <div class="col-md-8 offset-md-2">
    <h2>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" formControlName="name" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" formControlName="description" required></textarea>
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" class="form-control" id="price" formControlName="price" required>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" formControlName="category" required>
          <option value="">Select Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Audio">Audio</option>
          <option value="Wearables">Wearables</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" formControlName="quantity" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isAvailable" formControlName="isAvailable">
        <label class="form-check-label" for="isAvailable">Available</label>
      </div>
      <div class="mb-3">
        <label for="imageUrl" class="form-label">Image URL</label>
        <input type="text" class="form-control" id="imageUrl" formControlName="imageUrl">
      </div>
      <div class="mb-3">
        <label for="rating" class="form-label">Rating</label>
        <input type="number" class="form-control" id="rating" formControlName="rating" min="0" max="5" step="0.1">
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="!productForm.valid">
        {{ isEditMode ? 'Update Product' : 'Add Product' }}
      </button>
      <button type="button" class="btn btn-secondary ms-2" (click)="cancel()">Cancel</button>
    </form>
  </div>
</div>
